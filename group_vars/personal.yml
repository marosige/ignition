---
homebrew_extra_packages:
  - pandoc # Recipe-manager dependency

homebrew_extra_casks:
  # Messaging
  - messenger             # Facebook Messenger client
  - whatsapp              # WhatsApp client
  - slack                 # Team communication
  - discord               # Voice and text chat
  - zoom                  # Video calls
  - skype                 # Video calls
  # Media
  - audacity              # Audio editor
  # Tools
  - sweet-home3d          # Home design
  - balenaetcher          # Bootable drive creation
  - philips-hue-sync      # Hue Sync
  - ukelele               # Keyboard layout editor
  - coconutbattery        # Battery monitoring
  - 8bitdo-ultimate-software # 8BitDo controller configuration

homebrew_extra_mas_apps:
  - { id: 408981434, name: "iMovie" } # Video editor

# Finder is always first (added by macOS automatically).
dock_apps:
  - { spacer: true }
  # Web
  - /Applications/Google Chrome.app
  - /Applications/ChatGPT.app
  - /Applications/YT Music.app
  - { spacer: true }
  # Messages
  - /Applications/Messenger.app
  - /System/Applications/Messages.app
  - /Applications/WhatsApp.app
  - /Applications/Slack.app
  - { spacer: true }
  # Productivity
  - /System/Applications/Calendar.app
  - /System/Applications/Reminders.app
  - /System/Applications/Notes.app
  - /System/Applications/Passwords.app
  - /System/Applications/Utilities/Screenshot.app
  - { spacer: true }
  # Development
  - /System/Applications/Utilities/Terminal.app
  - /Applications/Fork.app
  - /Applications/Visual Studio Code.app
  - /Applications/Android Studio.app
  - { spacer: true }

dock_folders:
  - "{{ ansible_env.HOME }}/Downloads"
