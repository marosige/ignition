---
- name: "Startup | Write startup script"
  ansible.builtin.template:
    src: startup.sh.j2
    dest: "{{ ansible_env.HOME }}/.ignition-startup.sh"
    mode: "0755"

- name: "Startup | Write LaunchAgent plist"
  ansible.builtin.template:
    src: com.ignition.startup.plist.j2
    dest: "{{ ansible_env.HOME }}/Library/LaunchAgents/com.ignition.startup.plist"
    mode: "0644"
  register: startup_plist

- name: "Startup | Unload LaunchAgent (to reload with changes)"
  ansible.builtin.command: >
    launchctl bootout gui/{{ ansible_user_uid }}
    {{ ansible_env.HOME }}/Library/LaunchAgents/com.ignition.startup.plist
  when: startup_plist.changed
  failed_when: false
  changed_when: false

- name: "Startup | Load LaunchAgent"
  ansible.builtin.command: >
    launchctl bootstrap gui/{{ ansible_user_uid }}
    {{ ansible_env.HOME }}/Library/LaunchAgents/com.ignition.startup.plist
  when: startup_plist.changed
  changed_when: true
