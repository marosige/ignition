---
- name: Install Rosetta (Apple Silicon only)
  ansible.builtin.command: softwareupdate --install-rosetta --agree-to-license
  when: ansible_architecture == "arm64"
  changed_when: false
  failed_when: false

- name: Check if Homebrew is installed
  ansible.builtin.stat:
    path: /opt/homebrew/bin/brew
  register: brew_arm

- name: Check if Homebrew is installed (Intel fallback)
  ansible.builtin.stat:
    path: /usr/local/bin/brew
  register: brew_intel

- name: Install Homebrew
  ansible.builtin.shell: |
    /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  when: not brew_arm.stat.exists and not brew_intel.stat.exists
  changed_when: true

- name: Update Homebrew
  community.general.homebrew:
    update_homebrew: true
  changed_when: false

- name: Install Homebrew formulae
  community.general.homebrew:
    name: "{{ homebrew_packages + homebrew_extra_packages }}"
    state: present

- name: Install Homebrew casks
  community.general.homebrew_cask:
    name: "{{ homebrew_casks + homebrew_extra_casks }}"
    state: present

- name: Install Mac App Store apps
  community.general.mas:
    id: "{{ item.id }}"
    state: present
  loop: "{{ homebrew_mas_apps + homebrew_extra_mas_apps }}"

- name: Enable Git Large File Storage
  ansible.builtin.command: git lfs install
  changed_when: false
