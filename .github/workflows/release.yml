name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (without the v)"
        default: "1.0.0"
        required: true

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    env:
      IGNITION_VERSION: ${{ inputs.version || '1.0.0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test
        continue-on-error: true
        run: swift test
      - name: Build app
        run: UNIVERSAL=1 ./scripts/build-app.sh
      - name: Zip
        run: ditto -c -k --keepParent build/Ignition.app Ignition.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Ignition
          path: Ignition.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version) }}
          name: Ignition ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: Ignition.zip
